[package]
name = "rustypdf-py"
description = "Python bindings for rustypdf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A cdylib for Python; it is built by maturin, not consumed as a crate.
publish = false

[lib]
# The module Python imports is `_rustypdf`; the `rustypdf` package around it is pure Python.
name = "_rustypdf"
crate-type = ["cdylib"]

[dependencies]
rustypdf.workspace = true

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json.workspace = true
