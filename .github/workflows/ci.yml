name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Pin the pdfium build, for the one job that still needs it. The default
  # build does not: it is pure Rust, which is what makes the crate a single
  # static binary and the wheel self-contained.
  PDFIUM_RELEASE: chromium/7961

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # The corpus is not committed — the PDFs are not ours to redistribute — so unit and
      # robustness tests run everywhere and corpus tests skip unless it is present.
      - name: Fetch corpus
        run: scripts/fetch-corpus.sh
        continue-on-error: true

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the extension module
        run: scripts/build.sh

      - name: Harness self-tests
        run: python3 -m unittest discover -s eval/tests

      # Quality is a number, and it must not silently fall. Needs the corpus, so it is allowed
      # to be skipped rather than failing the build when arXiv is unreachable.
      - name: Fetch corpus
        id: corpus
        run: scripts/fetch-corpus.sh
        continue-on-error: true

      - name: Check for quality regressions
        if: steps.corpus.outcome == 'success'
        working-directory: eval
        run: PYTHONPATH=.:../python python3 -m rustypaper_eval --baseline baseline.json

  # The pdfium backend is an escape hatch for documents rustium cannot yet
  # read, and the reference the pure-Rust one is measured against. Nothing
  # ships with it, but it has to keep compiling and passing — an escape hatch
  # discovered to be broken at the moment it is needed is not one.
  pdfium-backend:
    name: pdfium feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pdfium
        run: scripts/fetch-pdfium.sh
      - run: cargo test --release --no-default-features --features pdfium
