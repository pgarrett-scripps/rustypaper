name: Release

# Publishes the crate, Python distributions, and native executables from a tag.
#
# The tag is the trigger and the version is read from Cargo.toml, so the two
# can disagree — and a release published under the wrong number cannot be
# unpublished, only yanked. The first job compares them and stops.
#
# rustium-pdf must already be on crates.io at the version this depends on.
# It is resolved from the registry rather than by path, so the failure this
# guards against is a `[patch.crates-io]` override left in the manifest:
# it resolves here and cannot resolve on the index.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rustypaper/**'
      - 'rustypaper-py/**'
      - 'python/**'
      - 'scripts/package_binary.py'
      - 'scripts/smoke_cli.py'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, publish nothing"
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

permissions:
  contents: read

jobs:
  verify:
    name: verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import tomllib
          from pathlib import Path
          cargo = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          python = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          if cargo != python:
              raise SystemExit(f'Rust version {cargo} does not match Python version {python}')
          PY

          if [ "${{ github.event_name }}" = "push" ] || [ "$MANUAL_PUBLISH" = "true" ]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [ "$GITHUB_REF" != "refs/tags/v$version" ]; then
              echo "::error::tag v$tag does not match Cargo.toml version $version."\
                   "A release cannot be unpublished, so this stops here."
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          MANUAL_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Everything the default build needs is Rust, so this is the whole gate.
      # Corpus tests skip when corpus/ is absent, which it is here — the PDFs
      # are not ours to redistribute.
      - run: cargo test --release
      - run: cargo publish --dry-run -p rustypaper --locked

  crate:
    name: crates.io
    needs: [verify, binaries, wheels, sdist]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # CARGO_REGISTRY_TOKEN is a crates.io API token scoped to
      # publish-update. crates.io also supports GitHub OIDC trusted
      # publishing, which removes the long-lived secret — worth switching to.
      #
      # Idempotent on purpose. crates.io and PyPI are separate uploads in one
      # release, so a failure on either side means re-running the workflow with
      # the other side already done — and cargo treats republishing a version
      # as an error rather than a no-op.
      - name: Publish, unless this version is already on the index
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if curl -sf -A "rustypaper-release" \
               "https://crates.io/api/v1/crates/rustypaper/$version" >/dev/null; then
            echo "rustypaper $version is already on crates.io; nothing to do."
            exit 0
          fi
          cargo publish -p rustypaper --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  wheels:
    name: wheel / ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel,   target: x86_64-apple-darwin }
          - { os: macos-14,         target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # One wheel per platform covers every supported Python: the extension is
      # built against the stable ABI (abi3-py39), so there is no interpreter
      # dimension to this matrix.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          # Only meaningful on Linux; builds the wheel inside a manylinux
          # container so it runs on distributions older than the runner.
          manylinux: auto

      - name: Install and test the wheel outside the source tree
        shell: bash
        run: |
          python -m pip install --no-deps python/dist/*.whl
          python scripts/smoke_cli.py rustypaper
          python scripts/smoke_cli.py python -m rustypaper

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: python/dist/*.whl

  sdist:
    name: sdist
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  binaries:
    name: binary / ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: x86_64-unknown-linux-gnu, suffix: '' }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, suffix: '' }
          - { os: macos-15-intel,   target: x86_64-apple-darwin, suffix: '' }
          - { os: macos-14,         target: aarch64-apple-darwin, suffix: '' }
          - { os: windows-latest,  target: x86_64-pc-windows-msvc, suffix: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native CLI
        run: cargo build --release --locked -p rustypaper --bin rustypaper --target ${{ matrix.target }}
      - name: Package and test the extracted executable
        run: python scripts/package_binary.py ${{ matrix.target }} ${{ needs.verify.outputs.version }} target/${{ matrix.target }}/release/rustypaper${{ matrix.suffix }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*

  github:
    name: GitHub release binaries
    needs: [verify, binaries, wheels, sdist]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and attach binaries
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release create "v$VERSION" --verify-tag --generate-notes
          fi
          gh release upload "v$VERSION" *.tar.gz *.zip SHA256SUMS --clobber

  pypi:
    name: PyPI
    needs: [verify, binaries, wheels, sdist]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: PyPI accepts a short-lived OIDC token from this
      # workflow instead of an API token stored here. The publisher is
      # configured at pypi.org/manage/account/publishing/ and its four claims
      # must match exactly — owner, repository, workflow filename, and the
      # environment named above. A mismatch on any one of them fails as
      # `invalid-publisher`, which reads like a missing publisher rather than
      # a disagreeing one.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
