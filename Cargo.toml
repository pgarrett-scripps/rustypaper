[workspace]
resolver = "2"
members = ["rustypaper", "rustypaper-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pgarrett-scripps/rustypaper"

[workspace.dependencies]
# `default-features = false` has to live here, not on the inheriting members: a member that
# writes it while the workspace entry omits it is silently ignored, and every binary quietly
# gets both backends compiled in.
rustypaper = { path = "rustypaper", version = "0.1.0", default-features = false }
# The pure-Rust PDF backend, from the registry. Deliberately not a path dependency: a path
# only resolves where the sibling checkout happens to exist, which is this machine and not a
# CI runner, and `cargo fmt --all` walks into it whether it is there or not. To develop the
# two together, add a temporary override rather than committing one:
#     [patch.crates-io]
#     rustium-pdf = { path = "../rustium-pdf" }
rustium = { package = "rustium-pdf", version = "0.1.0" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
# Must track the `image` version pdfium-render's `image_latest` feature resolves to, so that
# `PdfBitmap::as_image()` hands back the same `DynamicImage` type we crop and encode.
image = { version = "0.25", default-features = false, features = ["png"] }
pdfium-render = "0.9"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Benchmarks and the eval harness need real optimisation but also usable backtraces.
[profile.bench]
debug = true
