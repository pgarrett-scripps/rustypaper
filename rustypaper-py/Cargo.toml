[package]
name = "rustypaper-py"
description = "Python bindings for rustypaper."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# A cdylib for Python; it is built by maturin, not consumed as a crate.
publish = false

[lib]
# The module Python imports is `_rustypaper`; the `rustypaper` package around it is pure Python.
name = "_rustypaper"
crate-type = ["cdylib"]

[dependencies]
rustypaper.workspace = true

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json.workspace = true
