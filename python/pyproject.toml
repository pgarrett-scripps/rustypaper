[project]
name = "rustypaper"
version = "0.1.1"
description = "Structure-aware conversion of born-digital scientific PDFs to Markdown, Typst and JSON."
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["pdf", "markdown", "typst", "science", "papers", "extraction"]
classifiers = [
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Markup",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/pgarrett-scripps/rustypaper"

# Built with maturin from the workspace root:
#   maturin build -m rustypaper-py/Cargo.toml
# `scripts/build.sh` is the no-maturin path: cargo produces an importable .so directly.
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../rustypaper-py/Cargo.toml"
module-name = "rustypaper._rustypaper"
# Where the pure-Python half lives. Without this maturin ships only the
# compiled extension, so `pip install rustypaper` yields an importable
# `_rustypaper` and no `rustypaper` — the package the docs tell people to import.
python-source = "."
# Nothing to bundle. The reader is pure Rust, so the extension is
# self-contained and the wheel is the extension plus this package: no native
# library travelling beside it, and no per-platform copy to keep in step.
