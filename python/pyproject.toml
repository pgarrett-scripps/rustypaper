[project]
name = "rustypdf"
version = "0.1.0"
description = "Structure-aware conversion of born-digital scientific PDFs to Markdown, Typst and JSON."
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["pdf", "markdown", "typst", "science", "papers", "extraction"]
classifiers = [
  "Programming Language :: Rust",
  "Topic :: Text Processing :: Markup",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/pgarrett-scripps/rustypdf"

# Built with maturin from the workspace root:
#   maturin build -m rustypdf-py/Cargo.toml
# `scripts/build.sh` is the no-maturin path: cargo produces an importable .so directly.
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../rustypdf-py/Cargo.toml"
module-name = "rustypdf._rustypdf"
# Where the pure-Python half lives. Without this maturin ships only the
# compiled extension, so `pip install rustypdf` yields an importable
# `_rustypdf` and no `rustypdf` — the package the docs tell people to import.
python-source = "."
# pdfium is loaded at runtime rather than linked, so it has to travel inside
# the wheel — without it `pip install rustypdf` produces a package that
# imports cleanly and then fails on the first conversion.
include = [{ path = "rustypdf/*pdfium*", format = "wheel" }]
