[package]
name = "rustypaper"
description = "Structure-aware conversion of born-digital scientific PDFs to Markdown, Typst and JSON. Fast, CPU-only, no models."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["pdf", "markdown", "typst", "science"]
categories = ["text-processing", "science"]
exclude = ["tests/corpus.rs"]

# One crate, one name: the library and the command line tool are the same package, because
# two crates cannot share a name on crates.io and this project has exactly one.
[[bin]]
name = "rustypaper"
path = "src/main.rs"

[dependencies]
# Used by the binary only, but cargo has no way to say so for a bin inside a library crate.
# They are small and pure Rust, so the cost to a library consumer is compile time, not weight.
anyhow.workspace = true
clap.workspace = true

rayon.workspace = true
rustium.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
